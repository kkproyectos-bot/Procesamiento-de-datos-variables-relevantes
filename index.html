<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supervisión del objetivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2a35; --ink-2:#51616e; --paper:#eef1f3; --panel:#ffffff; --head:#dfe6eb; --line:#c5cfd6;
  --accent:#1e5b78; --accent-ink:#ffffff; --focus:#0a7bb5;
  --rojo:#f26d6d; --amarillo:#f6d860; --verde:#5cb87a; --violeta:#b9a7ef; --violeta-2:#d6cbf7; --cell-ink:#1c2a35;
  --f-head:'Barlow Semi Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --f-body:'Barlow','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6ecf0; --ink-2:#9fb0bc; --paper:#141b21; --panel:#1b242b; --head:#26333c; --line:#36444e;
    --accent:#6bb6d6; --accent-ink:#0f1a20; --focus:#7cc7e8;
  }
}
:root[data-theme="dark"]{
  --ink:#e6ecf0; --ink-2:#9fb0bc; --paper:#141b21; --panel:#1b242b; --head:#26333c; --line:#36444e;
  --accent:#6bb6d6; --accent-ink:#0f1a20; --focus:#7cc7e8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{max-width:1120px;margin:0 auto;padding:28px 20px 56px}
header.top{padding-bottom:18px}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(1.7rem,3.4vw,2.3rem);line-height:1.1;margin:0 0 6px;letter-spacing:.005em}
#estado{margin:0;color:var(--ink-2)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px 11px;background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;color:var(--ink-2);font-family:var(--f-head);font-weight:600;font-size:1.05rem;white-space:nowrap}
.tab .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;font-size:.82rem;font-weight:600}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.panel{background:var(--panel);border:1px solid var(--line);border-top:0;padding:26px 24px 30px}
.panel h2{font-family:var(--f-head);font-weight:700;font-size:1.5rem;margin:0 0 4px}
.lead{margin:0 0 20px;color:var(--ink-2);max-width:62ch}

.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px 22px;max-width:820px}
.campos label{display:flex;flex-direction:column;gap:6px;font-weight:500}
.campos .ancho{grid-column:1/-1}
select,input[type=number],textarea{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:9px 10px;width:100%}
textarea{font-family:var(--f-body);font-variant-numeric:tabular-nums;resize:vertical;min-height:170px;line-height:1.45}
.ayuda{color:var(--ink-2);font-size:.95rem;margin:16px 0 0;max-width:70ch}
.acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}

button.primario,button.sec{border-radius:3px;padding:10px 18px;font-weight:600;cursor:pointer;border:1.5px solid var(--accent)}
button.primario{background:var(--accent);color:var(--accent-ink)}
button.primario:hover{filter:brightness(1.08)}
button.sec{background:transparent;color:var(--accent)}
button.sec:hover{background:var(--head)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}

.mensajes{margin-top:16px;display:grid;gap:8px}
.aviso{border-left:4px solid var(--accent);background:var(--paper);padding:10px 14px;max-width:80ch}
.aviso.mal{border-left-color:var(--rojo)}
.aviso.atencion{border-left-color:var(--amarillo)}
.aviso ul{margin:6px 0 0;padding-left:20px}
.aviso button{margin-left:6px;margin-top:4px}

.scroll{overflow:auto;max-width:100%;border:1px solid var(--line)}
.scroll.alto{max-height:340px}
table.tabla{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tabla th,.tabla td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tabla th{background:var(--head);font-family:var(--f-head);font-weight:600;position:sticky;top:0}
.tabla td.izq,.tabla th.izq{text-align:left}
.tabla tfoot td{font-weight:700;background:var(--head)}
.tabla .cero{color:var(--ink-2)}
.control{margin:14px 0 0;color:var(--ink-2);font-size:.95rem}

.leyenda{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 16px;align-items:center}
.leyenda span.item{display:inline-flex;align-items:center;gap:8px}
.muestra{width:18px;height:18px;border:1px solid rgba(0,0,0,.25);display:inline-block}
.muestra.rojo{background:var(--rojo)}.muestra.amarillo{background:var(--amarillo)}.muestra.verde{background:var(--verde)}
.opcion{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.opcion input{width:18px;height:18px;accent-color:var(--accent)}

.cal-wrap{overflow-x:auto;max-width:100%}
.cal-titulo{font-family:var(--f-head);font-weight:700;font-size:1.35rem;margin:0 0 10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:760px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dia{border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.dia.vacio{background:var(--paper);opacity:.55}
.dia-h{font-family:var(--f-head);font-weight:600;text-align:center;padding:5px 6px;background:var(--head)}
.fr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;font-size:.92rem;color:var(--cell-ink);border-top:1px solid rgba(28,42,53,.2);font-variant-numeric:tabular-nums}
.fr.rojo{background:var(--rojo)}.fr.amarillo{background:var(--amarillo)}.fr.verde{background:var(--verde)}
.fr .t{font-weight:600}
.fr.revisar{background:repeating-linear-gradient(135deg,var(--violeta) 0 9px,var(--violeta-2) 9px 18px)}
.muestra.revisar{background:repeating-linear-gradient(135deg,var(--violeta) 0 5px,var(--violeta-2) 5px 10px)}
.tabla td.revisar{background:repeating-linear-gradient(135deg,var(--violeta) 0 9px,var(--violeta-2) 9px 18px);color:#1c2a35;font-weight:600}
.tabla td.wrap{white-space:normal;min-width:180px}
.cortes{margin-top:26px}
button.chico{padding:5px 11px;font-size:.9rem}
.tabla td.acc{white-space:nowrap}
.est{display:inline-flex;align-items:center;gap:6px;font-weight:500}
input.ed{width:100%;min-width:158px;font-variant-numeric:tabular-nums;padding:5px 7px;background:var(--paper);border:1px solid var(--line);border-radius:3px}
#banner{margin:0 0 14px}
.cortes h3{font-family:var(--f-head);font-weight:700;font-size:1.2rem;margin:0 0 6px}
.cortes p{margin:0 0 12px;color:var(--ink-2);max-width:78ch}

.vacio-msg{padding:26px 22px;border:1px dashed var(--line);max-width:640px}
.vacio-msg p{margin:0 0 14px}
.grupo{border:0;padding:0;margin:0 0 22px}
.grupo legend{font-family:var(--f-head);font-weight:600;font-size:1.1rem;padding:0;margin-bottom:8px}
.grupo .opcion{display:flex;margin-bottom:6px}
#msg-descarga{margin-top:16px;min-height:1.5em}

@media (max-width:640px){
  .app{padding:18px 12px 40px}
  .panel{padding:20px 14px 24px}
  .tab{padding:10px 12px 9px;font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.subtitulo{font-family:var(--f-head);font-weight:700;font-size:1.2rem;margin:26px 0 8px}
.subtitulo:first-child{margin-top:0}
.tabla th small{font-weight:400;color:var(--ink-2);display:block}
.tabla td.sep,.tabla th.sep{border-left:2px solid var(--line)}
.tabla td.c-rojo{background:var(--rojo);color:var(--cell-ink)}.tabla td.c-amarillo{background:var(--amarillo);color:var(--cell-ink)}.tabla td.c-verde{background:var(--verde);color:var(--cell-ink)}.tabla td.c-verdeosc{background:#00703c;color:#fff;font-weight:600}
.tabla tfoot td.c-rojo{background:var(--rojo);color:var(--cell-ink)}.tabla tfoot td.c-amarillo{background:var(--amarillo);color:var(--cell-ink)}.tabla tfoot td.c-verde{background:var(--verde);color:var(--cell-ink)}.tabla tfoot td.c-verdeosc{background:#00703c;color:#fff}
.chip{display:inline-block;padding:2px 10px;border-radius:3px;font-weight:600}.chip.c-rojo{background:var(--rojo);color:var(--cell-ink)}.chip.c-amarillo{background:var(--amarillo);color:var(--cell-ink)}.chip.c-verde{background:var(--verde);color:var(--cell-ink)}.chip.c-verdeosc{background:#00703c;color:#fff}
.muestra.verdeosc{background:#00703c}
.sin-cal{padding:22px;border:1px dashed var(--line);max-width:640px}
#empresa-linea{margin:2px 0 6px;font-weight:600;letter-spacing:.01em}
#empresa-linea:empty{display:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="titulo">Supervisión del objetivo</h1>
    <p id="empresa-linea"></p>
    <p id="estado" aria-live="polite"></p>
    <div id="banner" class="aviso" role="status" hidden></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Pasos del análisis">
    <button class="tab" role="tab" id="tab-1" aria-controls="panel-1" aria-selected="true"><span class="n">1</span><span>Mes y variable</span></button>
    <button class="tab" role="tab" id="tab-2" aria-controls="panel-2" aria-selected="false" tabindex="-1"><span class="n">2</span><span>Carga de datos</span></button>
    <button class="tab" role="tab" id="tab-3" aria-controls="panel-3" aria-selected="false" tabindex="-1"><span class="n">3</span><span id="tl-3">Resumen</span></button>
    <button class="tab" role="tab" id="tab-4" aria-controls="panel-4" aria-selected="false" tabindex="-1"><span class="n">4</span><span id="tl-4">Calendario</span></button>
    <button class="tab" role="tab" id="tab-5" aria-controls="panel-5" aria-selected="false" tabindex="-1"><span class="n">5</span><span>Descargas</span></button>
  </div>

  <section class="panel" id="panel-1" role="tabpanel" aria-labelledby="tab-1">
    <h2>Mes y variable</h2>
    <p class="lead">Elegí el mes que querés analizar y la variable que se va a calcular.</p>
    <div class="campos">
      <label>Mes
        <select id="mes"></select>
      </label>
      <label>Año
        <input id="anio" type="number" min="2000" max="2100" step="1">
      </label>
      <label>Barrio
        <input id="empresa" type="text" list="lista-empresas" placeholder="Ej.: Costa Esmeralda" autocomplete="off" style="background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:9px 10px;width:100%">
      </label>
      <label>Empresa <span style="font-weight:400">(opcional)</span>
        <input id="subempresa" type="text" list="lista-subempresas" placeholder="Ej.: GSP" autocomplete="off" style="background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:9px 10px;width:100%">
      </label>
      <datalist id="lista-empresas"></datalist><datalist id="lista-subempresas"></datalist>
      <label class="ancho">Variable
        <select id="variable"></select>
      </label>
      <span id="mod-controles" style="display:contents"></span>
    </div>
    <p class="ayuda" id="ayuda-var"></p>
    <div class="acciones">
      <button class="primario" data-goto="2">Continuar con la carga de datos</button>
    </div>
  </section>

  <section class="panel" id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden>
    <h2>Carga de datos</h2>
    <p class="lead" id="lead-2"></p>
    <div id="carga-propia" style="display:none"></div>
    <label for="pegado" id="lbl-pegado" style="font-weight:500;display:block;margin-bottom:6px"></label>
    <textarea id="pegado" spellcheck="false"></textarea>
    <div class="acciones">
      <button class="primario" id="btn-ver-resumen" disabled>Ver resumen</button>
      <button class="sec" id="btn-limpiar">Borrar datos</button>
    </div>
    <div class="mensajes" id="mensajes" aria-live="polite"></div>
    <div id="preview" style="margin-top:20px"></div>
  </section>

  <section class="panel" id="panel-3" role="tabpanel" aria-labelledby="tab-3" hidden>
    <h2 id="h-3">Resumen</h2>
    <p class="lead" id="lead-3"></p>
    <div id="resumen"></div>
  </section>

  <section class="panel" id="panel-4" role="tabpanel" aria-labelledby="tab-4" hidden>
    <h2 id="h-4">Calendario</h2>
    <div id="calendario"></div>
  </section>

  <section class="panel" id="panel-5" role="tabpanel" aria-labelledby="tab-5" hidden>
    <h2>Descargas</h2>
    <p class="lead">Elegí qué querés incluir y en qué formato lo querés descargar.</p>
    <fieldset class="grupo">
      <legend>Qué incluir</legend>
      <div id="desc-opciones"></div>
    </fieldset>
    <div class="acciones">
      <button class="primario" id="btn-xlsx" disabled>Descargar Excel (.xlsx)</button>
      <button class="primario" id="btn-pdf" disabled>Descargar PDF</button>
    </div>
    <p id="msg-descarga" aria-live="polite"></p>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   NÚCLEO: utilidades, lectura de lo pegado, solapas, descargas
   Cada variable es un módulo independiente (ver VARS al final).
   Un módulo define: nombre, textos de ayuda, procesar(), resumen,
   calendario (opcional), y qué sale en Excel y PDF.
   ===================================================================== */
var DAY=86400000;
var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
var RGB={rojo:[242,109,109],amarillo:[246,216,96],verde:[92,184,122],revisar:[185,167,239],verdeosc:[0,112,60]};
var ARGB={rojo:'FFF26D6D',amarillo:'FFF6D860',verde:'FF5CB87A',revisar:'FFB9A7EF',verdeosc:'FF00703C'};

var hoy=new Date();
var state={varId:'permanencia',month:hoy.getMonth(),year:hoy.getFullYear(),filas:[],issues:[],issuesMod:[],skipped:0,notice:'',incl:{}};
var VARS={};
function mod(){return VARS[state.varId];}
/* ---------- barrio (state.empresa) y empresa (state.subempresa): salen en pantalla, en el Excel y en el PDF ---------- */
state.empresa=''; state.subempresa='';
var LS_EMP='supervision_empresas_v1';
function empresaTxt(){var e=state.empresa.trim(), u=state.subempresa.trim(); return e&&u?e+' · '+u:(e||u);}
function empresaLinea(){var e=state.empresa.trim(), u=state.subempresa.trim(), t=[]; if(e)t.push('Barrio: '+e); if(u)t.push('Empresa: '+u); return t.join('   ·   ');}
function leerEmpresas(){try{var x=JSON.parse(localStorage.getItem(LS_EMP)||'null');return x&&typeof x==='object'?x:{ult:{e:'',u:''},emp:[],sub:[]};}catch(e){return {ult:{e:'',u:''},emp:[],sub:[]};}}
function guardarEmpresas(){
  try{
    var x=leerEmpresas(), e=state.empresa.trim(), u=state.subempresa.trim();
    x.ult={e:e,u:u};
    if(e&&x.emp.indexOf(e)<0) x.emp.unshift(e); if(u&&x.sub.indexOf(u)<0) x.sub.unshift(u);
    x.emp=x.emp.slice(0,30); x.sub=x.sub.slice(0,30);
    localStorage.setItem(LS_EMP,JSON.stringify(x));
  }catch(e){}
}
function llenarListas(){
  var x=leerEmpresas();
  document.getElementById('lista-empresas').innerHTML=x.emp.map(function(t){return '<option value="'+esc(t)+'">';}).join('');
  document.getElementById('lista-subempresas').innerHTML=x.sub.map(function(t){return '<option value="'+esc(t)+'">';}).join('');
}
function renderEmpresa(){document.getElementById('empresa-linea').textContent=empresaTxt();}
/* Excel: barrio y empresa van en la primera línea de la celda de título (A1) de cada hoja visible */
function empresaEnXlsx(wb){
  var t=empresaLinea(); if(!t) return;
  wb.eachSheet(function(ws){
    if(ws.state==='hidden') return;
    var c=ws.getCell('A1'), v=c.value, tit=(v&&v.richText)?v.richText.map(function(r){return r.text;}).join(''):(v===null||v===undefined?'':String(v));
    var f=c.font||{bold:true,size:14};
    c.value={richText:[{text:t+(tit?'\n':''),font:{bold:true,size:11,color:{argb:'FF4A5866'}}},{text:tit,font:Object.assign({},f)}]};
    c.alignment=Object.assign({},c.alignment||{},{wrapText:true,vertical:'middle'});
    ws.getRow(1).height=tit?40:20;
  });
}
/* PDF: barrio y empresa van arriba a la derecha de cada página */
function empresaEnPdf(doc){
  var t=empresaLinea(); if(!t) return;
  var n=doc.getNumberOfPages();
  for(var i=1;i<=n;i++){
    doc.setPage(i);
    var w=doc.internal.pageSize.getWidth();
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(74,88,102);
    doc.text(t,w-10,8,{align:'right'});
  }
  doc.setTextColor(28,42,53);
}

function $(id){return document.getElementById(id);}
function pad2(n){return (n<10?'0':'')+n;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(s){ s=Math.round(s); var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return pad2(h)+':'+pad2(m)+':'+pad2(x); }
function fmtCero(s){return Math.round(s)===0?'-':fmt(s);}
function fmtFechaHora(ms){var d=new Date(ms);return pad2(d.getUTCDate())+'/'+pad2(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()+' '+pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes())+':'+pad2(d.getUTCSeconds());}
function fmtFecha(y,m,d){return pad2(d)+'/'+pad2(m+1)+'/'+y;}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_');}

/* ---------- lectura de lo pegado (común a todas las variables) ---------- */
var RX=/(\d{1,2})\/(\d{1,2})\/(\d{4})[\sT,;]+(\d{1,2}):(\d{2})(?::(\d{2}))?/g;
var RX1=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*$/;
function toMs(m){
  var d=+m[1],mo=+m[2],y=+m[3],h=+m[4],mi=+m[5],s=m[6]?+m[6]:0;
  if(mo<1||mo>12||d<1||h>23||mi>59||s>59) return NaN;
  var t=Date.UTC(y,mo-1,d,h,mi,s), dt=new Date(t);
  if(dt.getUTCDate()!==d||dt.getUTCMonth()!==mo-1) return NaN;
  return t;
}
function parseUna(str){var m=RX1.exec(str);return m?toMs(m):NaN;}
/* Cada fila válida tiene entrada (a), salida (b), número de fila (n) y "rest": el texto de las columnas que siguen (con tabuladores). */
function leerFilas(text){
  var filas=[],issues=[],skipped=0;
  text.split(/\r?\n/).forEach(function(raw,i){
    var line=raw.trim(); if(!line) return;
    var n=i+1, ms=Array.from(line.matchAll(RX));
    if(ms.length===0){
      if(!/\d/.test(line)){skipped++;return;}
      issues.push('Fila '+n+': no se encontró una fecha con formato dd/mm/aaaa hh:mm:ss.'); return;
    }
    if(ms.length===1){issues.push('Fila '+n+': falta la fecha de salida (se necesitan dos columnas).');return;}
    var a=toMs(ms[0]), b=toMs(ms[1]);
    if(isNaN(a)||isNaN(b)){issues.push('Fila '+n+': fecha u hora no válida.');return;}
    if(b<a){issues.push('Fila '+n+': la salida es anterior a la entrada.');return;}
    var rest=line.slice(ms[1].index+ms[1][0].length).replace(/^[\s;,]+/,'');
    filas.push({a:a,b:b,n:n,rest:rest});
  });
  return {filas:filas,issues:issues,skipped:skipped};
}

function leerSupervisor(rest){
  var t=(rest||'').replace(/^[\s;,]+/,'').trim(); if(!t) return null;
  var parts=t.split(/\s*\t+\s*/).filter(function(x){return x;}), nombre='', dni='';
  if(parts.length>=2){ nombre=parts[0]; var d=parts[1].replace(/[.\s]/g,''); if(/^\d{6,10}$/.test(d)) dni=d; }
  else { var m=/^(.*?)[\s,;]+(\d[\d.]{5,11})$/.exec(t); if(m){nombre=m[1].trim();dni=m[2].replace(/\./g,'');} else nombre=t; }
  nombre=nombre.replace(/\s+/g,' ').trim(); if(!nombre) return null;
  return {nombre:nombre,dni:dni,key:dni||norm(nombre)};
}

function pdfGrid(doc,y,cw,headRows,body,foot,opt){
  opt=opt||{}; var x0=opt.x0||10, rh=7, GRIS=[223,230,235], maxY=opt.maxY||200, orient=opt.orient||'landscape', top=opt.top||15;
  doc.setDrawColor(150,163,174); doc.setLineWidth(0.2); doc.setFontSize(8); doc.setTextColor(28,42,53);
  function recortar(txt,ancho){var e=txt||'';while(e.length>0&&doc.getTextWidth(e)>ancho-3)e=e.slice(0,-1);if(e.length<(txt||'').length)e=e.slice(0,-1)+'...';return e;}
  function fila(cells,fill,bold){
    var x=x0, ci=0;
    cells.forEach(function(c){
      var cell=(typeof c==='object')?c:{t:c,span:1}, span=cell.span||1, w=0;
      for(var k=0;k<span;k++) w+=cw[ci+k];
      if(fill){doc.setFillColor(fill[0],fill[1],fill[2]);doc.rect(x,y,w,rh,'FD');} else doc.rect(x,y,w,rh,'S');
      doc.setFont('helvetica',bold?'bold':'normal');
      var first=(ci===0), t=recortar(String(cell.t),w);
      doc.text(t,first?x+2:x+w/2,y+rh/2+1.2,first?{}:{align:'center'});
      x+=w; ci+=span;
    });
    y+=rh;
  }
  function cabeceras(){headRows.forEach(function(h){fila(h,GRIS,true);});}
  cabeceras();
  body.forEach(function(r){ if(y+rh>maxY){doc.addPage('a4',orient);y=top;cabeceras();} fila(r,null,false); });
  if(foot){ if(y+rh>maxY){doc.addPage('a4',orient);y=top;cabeceras();} fila(foot,GRIS,true); }
  return y;
}

function distribute(records){
  var map=new Map();
  records.forEach(function(r){
    var t=r.a;
    while(t<r.b){
      var di=Math.floor(t/DAY), ds=di*DAY, end=Math.min(r.b,ds+DAY);
      var arr=map.get(di); if(!arr){arr=[0,0,0];map.set(di,arr);}

  });

}

    if(cuts>0) list.push({key:r.a+'|'+r.b+'|'+(r.extra||''),n:r.n,a:r.a,b:r.b,extra:r.extra,cuts:cuts,days:days,antes:cuts===1?(first-r.a)/1000:null,despues:cuts===1?(r.b-first)/1000:null});

function monthModel(){
  var y=state.year, m=state.month, n=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  var rows=[], tot=[0,0,0];
  for(var d=1;d<=n;d++){
    var t=Date.UTC(y,m,d), v=S.dist.get(Math.floor(t/DAY))||[0,0,0];
    var wd=(new Date(t).getUTCDay()+6)%7;
    rows.push({d:d,wd:wd,f:v.slice(),total:v[0]+v[1]+v[2],rev:S.nochesRev.has(Math.floor(t/DAY))});
    for(var k=0;k<3;k++) tot[k]+=v[k];
  }
  return {y:y,m:m,n:n,rows:rows,tot:tot,total:tot[0]+tot[1]+tot[2]};
}
function semanas(M){
  var weeks=[], cur=new Array(7).fill(null);
  M.rows.forEach(function(r){
    cur[r.wd]=r;
    if(r.wd===6){weeks.push(cur);cur=new Array(7).fill(null);}
  });
  if(cur.some(function(x){return x;})) weeks.push(cur);
  return weeks;
}


function renderResumen(){
  $('lead-3').textContent=VARIABLE+', '+MESES[state.month].toLowerCase()+' '+state.year+'. Cada permanencia se reparte según los minutos que caen en cada franja y en cada día.';
  if(S.records.length===0){ $('resumen').innerHTML=vacioHtml(); return; }
  var M=monthModel();
  var filas=M.rows.map(function(r){
    function c(s,rev){return '<td'+(rev?' class="revisar" title="Permanencia partida por la medianoche: revisar el corte"':(Math.round(s)===0?' class="cero"':''))+'>'+fmtCero(s)+(rev?' *':'')+'</td>';}
    return '<tr><td>'+fmtFecha(M.y,M.m,r.d)+'</td><td class="izq">'+DIAS[r.wd]+'</td>'+c(r.total)+c(r.f[0])+c(r.f[1])+c(r.f[2],r.rev)+'</tr>';
  }).join('');
  var pie='<tr><td class="izq" colspan="2">Total del mes</td><td>'+fmt(M.total)+'</td><td>'+fmt(M.tot[0])+'</td><td>'+fmt(M.tot[1])+'</td><td>'+fmt(M.tot[2])+'</td></tr>';
  var suma=0; S.records.forEach(function(r){suma+=(r.b-r.a)/1000;});
  var ctrl=Math.round(suma)===Math.round(M.total)
    ? 'Control: el total del mes coincide con la suma de todas las permanencias cargadas ('+fmt(suma)+').'
    : 'Control: las permanencias cargadas suman '+fmt(suma)+' y este mes muestra '+fmt(M.total)+'. La diferencia corresponde a otros meses.';
  $('resumen').innerHTML='<div class="scroll"><table class="tabla"><thead><tr><th>Día</th><th class="izq">Día de la semana</th><th>Total del día</th><th>'+FRANJAS[0]+'</th><th>'+FRANJAS[1]+'</th><th>'+FRANJAS[2]+'</th></tr></thead><tbody>'+filas+'</tbody><tfoot>'+pie+'</tfoot></table></div><p class="control">'+ctrl+'</p>'+(pendientesDelMes(M).length?'<p class="control"><i class="muestra revisar" style="vertical-align:-3px;margin-right:6px"></i>* Franja nocturna con una permanencia partida por la medianoche: revisar el corte.</p>':'')+cortesHtml(M);
}
function renderCalendario(){
  var box=$('calendario');
  if(S.records.length===0){ box.innerHTML=vacioHtml(); return; }
  var M=monthModel(), W=semanas(M), cells='';
  W.forEach(function(w){
    w.forEach(function(r){
      if(!r){cells+='<div class="dia vacio"></div>';return;}
      var h='<div class="dia"><div class="dia-h">'+DIAS[r.wd]+' '+r.d+'</div>';
      for(var k=0;k<3;k++){
        var e=estado(r.f[k]), rv=(k===2&&r.rev), lbl=FRANJAS[k]+', '+fmt(r.f[k])+', '+estadoTxt(e)+(rv?'. Permanencia partida por la medianoche: revisar el corte':'');
        h+='<div class="fr '+(rv?'revisar':e)+'" title="'+esc(lbl)+'" aria-label="'+esc(lbl)+'"><span>'+FRANJAS[k]+(rv?' *':'')+'</span>'+(S.showTimes?'<span class="t">'+fmtCero(r.f[k])+'</span>':'')+'</div>';
      }
      cells+=h+'</div>';
    });
  });
  box.innerHTML=
    '<div class="leyenda">'+
      '<span class="item"><i class="muestra rojo"></i>Sin permanencia</span>'+
      '<span class="item"><i class="muestra amarillo"></i>Menos de '+thrTxt()+' h</span>'+
      '<span class="item"><i class="muestra verde"></i>'+thrTxt()+' h o más</span>'+
      (pendientesDelMes(M).length?'<span class="item"><i class="muestra revisar"></i>* Corte por medianoche: revisar</span>':'')+
      '<label class="opcion"><input type="checkbox" class="chk-tiempos"'+(S.showTimes?' checked':'')+'> Mostrar el tiempo en cada celda</label>'+
    '</div>'+
    '<h3 class="cal-titulo">'+MESES[M.m]+' '+M.y+'</h3>'+
    '<div class="cal-wrap"><div class="cal">'+cells+'</div></div>'+cortesHtml(M);
}


function procesarFilas(filas){
  S.records=filas.map(function(f){return {a:f.a,b:f.b,n:f.n,extra:f.rest.replace(/\s*\t+\s*/g,' · ').trim()};});
  S.dist=distribute(S.records);
  S.cortes=detectarCortes(S.records).list; recalcRev();
  return [];
}
function preview(){
  var n=S.records.length;
  var filas=S.records.slice(0,500).map(function(r,i){
    return '<tr><td>'+(i+1)+'</td><td>'+fmtFechaHora(r.a)+'</td><td>'+fmtFechaHora(r.b)+'</td><td>'+fmt((r.b-r.a)/1000)+'</td></tr>';
  }).join('');
  return '<div class="scroll alto"><table class="tabla"><thead><tr><th>N°</th><th>Entrada</th><th>Salida</th><th>Permanencia</th></tr></thead><tbody>'+filas+'</tbody></table></div>'+(n>500?'<p class="control">Se muestran los primeros 500 registros. Todos se usan en el cálculo.</p>':'');
}
function avisosCarga(){
  var msgs=[];
  if(S.cortes.length){
    var np=S.cortes.filter(function(c){return estadoCorte(c)==='pendiente';}).length, nt=S.cortes.length;
    msgs.push('<div class="aviso atencion"><strong>'+nt+(nt===1?' permanencia cruza':' permanencias cruzan')+' la medianoche.</strong> Se reparten entre dos días. '+(np?np+(np===1?' está pendiente de revisión: se marca':' están pendientes de revisión: se marcan')+' en violeta en el resumen y en el calendario, donde podés validar o modificar el corte.':'Todas están revisadas.')+'</div>');
  }
  var largos=S.records.filter(function(r){return r.b-r.a>DAY;}).length;
  if(largos) msgs.push('<div class="aviso atencion">Hay '+largos+(largos===1?' permanencia':' permanencias')+' de más de 24 horas. Conviene revisar que las fechas estén bien cargadas.</div>');
  return msgs;
}
function ayudaHtml(){
  return 'En el calendario, cada franja se pinta de rojo si no hubo permanencia, de amarillo si hubo menos de '+thrTxt()+' h y de verde si hubo '+thrTxt()+' h o más. Las permanencias que cruzan la medianoche se reparten entre dos días y se marcan en violeta para revisar el corte.';
}

function pdfResumen(doc,M){
  var x0=14, y=18, cw=[24,28,28,34,34,34];
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(28,42,53);
  doc.text(VARIABLE,x0,y);
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.text(MESES[M.m]+' '+M.y,x0,y+7);
  y=32;
  function fila(vals,h,bold,fill,celdas){
    var x=x0;
    vals.forEach(function(v,i){
      var f=(celdas&&celdas[i])||fill;
      if(f){doc.setFillColor(f[0],f[1],f[2]);doc.rect(x,y,cw[i],h,'FD');} else doc.rect(x,y,cw[i],h,'S');
      doc.setFont('helvetica',bold?'bold':'normal');
      doc.text(String(v),x+cw[i]/2,y+h/2+1.3,{align:'center'});
      x+=cw[i];
    });
    y+=h;
  }
  doc.setDrawColor(150,163,174); doc.setLineWidth(0.2); doc.setFontSize(8.5);
  fila(['Día','Día de la semana','Total del día',FRANJAS[0],FRANJAS[1],FRANJAS[2]],9,true,[223,230,235]);
  M.rows.forEach(function(r){fila([fmtFecha(M.y,M.m,r.d),DIAS[r.wd],fmtCero(r.total),fmtCero(r.f[0]),fmtCero(r.f[1]),fmtCero(r.f[2])+(r.rev?' *':'')],7,false,null,r.rev?{5:RGB.revisar}:null);});
  fila(['Total del mes','',fmt(M.total),fmt(M.tot[0]),fmt(M.tot[1]),fmt(M.tot[2])],8,true,[223,230,235]);
  if(pendientesDelMes(M).length){
    y+=5; doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.setFillColor(RGB.revisar[0],RGB.revisar[1],RGB.revisar[2]); doc.rect(x0,y-3.2,4.5,4.5,'FD');
    doc.text('* Franja nocturna con una permanencia partida por la medianoche: revisar el corte.',x0+7,y);
  }
}
function pdfCalendario(doc,M,showTimes){
  var mx=10, W=semanas(M), cw=(297-2*mx)/7, y=16;
  doc.setTextColor(28,42,53); doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text(VARIABLE+': '+MESES[M.m]+' '+M.y,mx,y);
  y=23; doc.setDrawColor(120,132,142); doc.setLineWidth(0.2);
  var hh=6, rh=5.6;
  W.forEach(function(w){
    w.forEach(function(r,ci){
      if(!r) return;
      var x=mx+ci*cw;
      doc.setFillColor(223,230,235); doc.rect(x,y,cw,hh,'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(28,42,53);
      doc.text(DIAS[r.wd]+' '+r.d,x+cw/2,y+hh/2+1.3,{align:'center'});
      for(var k=0;k<3;k++){
        var rv=(k===2&&r.rev), e=estado(r.f[k]), yy=y+hh+k*rh, col=RGB[rv?'revisar':e];
        doc.setFillColor(col[0],col[1],col[2]); doc.rect(x,yy,cw,rh,'FD');
        doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
        doc.text(FRANJAS[k]+(rv?' *':''),x+2,yy+rh/2+1.1);
        if(showTimes) doc.text(fmtCero(r.f[k]),x+cw-2,yy+rh/2+1.1,{align:'right'});
      }
    });
    y+=hh+3*rh;
  });
  y+=6; doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  var leyPdf=[['rojo','Sin permanencia'],['amarillo','Menos de '+thrTxt()+' h'],['verde',thrTxt()+' h o mas']];
  if(pendientesDelMes(M).length) leyPdf.push(['revisar','* Corte por medianoche: revisar']);
  leyPdf.forEach(function(x,i){
    var col=RGB[x[0]], px=mx+i*55;
    doc.setFillColor(col[0],col[1],col[2]); doc.rect(px,y-3.2,4.5,4.5,'FD');
    doc.text(x[1],px+7,y);
  });
}
function pdfCortes(doc,M){
  var L=cortesDelMes(M), CR=correccionesVisibles(), mx=10, y=18;
  function recortar(txt,ancho){var e=txt||'';while(e.length>0&&doc.getTextWidth(e)>ancho-4)e=e.slice(0,-1);if(e.length<(txt||'').length)e=e.slice(0,-1)+'...';return e;}
  function cabecera(cw,tit){
    var x=mx; doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setDrawColor(150,163,174); doc.setLineWidth(0.2); doc.setTextColor(28,42,53);
    tit.forEach(function(t,i){doc.setFillColor(214,203,247);doc.rect(x,y,cw[i],8,'FD');doc.text(t,x+cw[i]/2,y+5,{align:'center'});x+=cw[i];}); y+=8;
  }
  function filas(cw,datos,estadoCol){
    datos.forEach(function(d){
      if(y>190){doc.addPage('a4','landscape');y=18;}
      var x=mx; doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(28,42,53);
      d.forEach(function(v,i){
        var pend=(i===estadoCol&&v==='Pendiente');
        if(pend){doc.setFillColor(RGB.revisar[0],RGB.revisar[1],RGB.revisar[2]);doc.rect(x,y,cw[i],7,'FD');} else doc.rect(x,y,cw[i],7,'S');
        var last=(i===d.length-1), t=recortar(String(v),cw[i]);
        doc.text(t,last?x+2:x+cw[i]/2,y+4.6,last?{}:{align:'center'}); x+=cw[i];
      }); y+=7;
    });
  }
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(28,42,53);
  doc.text('Cortes por medianoche: '+MESES[M.m]+' '+M.y,mx,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  var t=doc.splitTextToSize(GUIA_CORTES,277); doc.text(t,mx,y+6); y+=6+t.length*4+4;
  if(L.length){
    var cw=[20,34,34,24,24,24,22,95];
    cabecera(cw,['Fila pegada','Entrada','Salida','Permanencia','Hasta las 00:00','Desde las 00:00','Estado','Datos adicionales de la fila']);
    filas(cw,L.map(function(c){return [String(c.n),fmtFechaHora(c.a),fmtFechaHora(c.b),fmt((c.b-c.a)/1000),c.antes===null?'varios':fmt(c.antes),c.despues===null?'varios':fmt(c.despues),txtEstado(c),c.extra||''];}),6);
  }
  if(CR.length){
    y+=8; if(y>175){doc.addPage('a4','landscape');y=18;}
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Correcciones realizadas (los valores originales siguen en el Excel de origen)',mx,y); y+=5;
    var c2=[20,38,38,38,38,105];
    cabecera(c2,['Fila pegada','Entrada original','Salida original','Entrada corregida','Salida corregida','Datos adicionales de la fila']);
    filas(c2,CR.map(function(x){return [String(x.n),fmtFechaHora(x.origA),fmtFechaHora(x.origB),fmtFechaHora(x.newA),fmtFechaHora(x.newB),x.extra||''];}),-1);
  }
}

function pdf(ctx,inc){
  var M=monthModel(), doc;
  if(inc.resumen){doc=ctx.nueva('portrait');pdfResumen(doc,M);}
  if(inc.calendario){doc=ctx.nueva('landscape');pdfCalendario(doc,M,S.showTimes);}
  if(cortesDelMes(M).length||correccionesVisibles().length){doc=ctx.nueva('landscape');pdfCortes(doc,M);}
}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-acc]'); if(!b) return;

var VIS=(function(){
var NOMBRE='Cantidad de visitas por autoridad (mensual y semanal)';
var S={visitas:[],total:0};

function procesarFilas(filas){
  var issues=[]; S.visitas=[]; S.total=filas.length;
  filas.forEach(function(f){
    var p=leerSupervisor(f.rest);
    if(!p){issues.push('Fila '+f.n+': falta el nombre de la autoridad (tercera columna).');return;}
    S.visitas.push({a:f.a,b:f.b,n:f.n,nombre:p.nombre,dni:p.dni,key:p.key});
  });

}
function mesesConDatos(){
  var out=new Map();
  S.visitas.forEach(function(v){var d=new Date(v.a),k=d.getUTCFullYear()*12+d.getUTCMonth();out.set(k,(out.get(k)||0)+1);});
  return out;
}
function corta(d,m){return pad2(d)+'/'+pad2(m+1);}
function modelo(){
  var y=state.year, m=state.month, n=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  var fw=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7, nSem=Math.ceil((n+fw)/7), semanas=[];
  for(var w=0;w<nSem;w++) semanas.push({n:w+1,ini:Math.max(1,w*7-fw+1),fin:Math.min(n,(w+1)*7-fw)});
  var map=new Map(), delMes=0;
  S.visitas.forEach(function(v){
    var d=new Date(v.a); if(d.getUTCFullYear()!==y||d.getUTCMonth()!==m) return;
    delMes++;
    var s=map.get(v.key);
    if(!s){s={nombre:v.nombre,dni:v.dni,vis:0,seg:0,dias:new Map(),sem:semanas.map(function(){return {v:0,s:0};})};map.set(v.key,s);}
    var dia=d.getUTCDate(); s.dias.set(dia,(s.dias.get(dia)||0)+(v.b-v.a)/1000);
    if(!s.dni&&v.dni) s.dni=v.dni;
  });
  /* días con presencia: días del mes en que la autoridad estuvo en el objetivo en algún momento,
     aunque no haya ingresado ese día (por ejemplo, una permanencia del 11 al 13 suma el 11, el 12 y el 13).
     Se toman todos los ingresos cargados, también los que empezaron el mes anterior.
     Una salida a las 00:00:00 en punto no suma el día siguiente. */
  var ini=Date.UTC(y,m,1), fin=Date.UTC(y,m+1,1);
  S.visitas.forEach(function(v){
    var a=Math.max(v.a,ini), b=Math.min(v.b>v.a?v.b-1:v.a,fin-1); if(b<a) return;
    var s=map.get(v.key);
    if(!s){s={nombre:v.nombre,dni:v.dni,vis:0,seg:0,dias:new Map(),sem:semanas.map(function(){return {v:0,s:0};})};map.set(v.key,s);}
    if(!s.pres) s.pres=new Set();
    for(var d0=Math.floor(a/DAY),d1=Math.floor(b/DAY),d=d0;d<=d1;d++) s.pres.add(new Date(d*DAY).getUTCDate());
  });
  map.forEach(function(s){s.np=s.pres?s.pres.size:0;});
  /* una visita por autoridad y por día: varios ingresos del mismo día cuentan como 1, con la suma de sus tiempos */
  map.forEach(function(s){ s.dias.forEach(function(dur,dia){ var w=Math.floor((dia-1+fw)/7); s.vis++; s.seg+=dur; s.sem[w].v++; s.sem[w].s+=dur; }); });
  var filas=Array.from(map.values()).sort(function(a,b){return a.nombre.localeCompare(b.nombre,'es');});
  var tot={vis:0,np:0,seg:0,sem:semanas.map(function(){return {v:0,s:0};})};
  filas.forEach(function(s){tot.vis+=s.vis;tot.np+=s.np;tot.seg+=s.seg;s.sem.forEach(function(x,i){tot.sem[i].v+=x.v;tot.sem[i].s+=x.s;});});
  return {y:y,m:m,n:n,semanas:semanas,filas:filas,tot:tot,cargadas:S.visitas.length,delMes:delMes};
}
function prom(seg,v){return v?fmt(seg/v):'-';}

  var p2='<tr><td class="izq">Total</td>'+M.tot.sem.map(function(x){return '<td class="sep">'+cnt(x.v)+'</td><td>'+fmtCero(x.s)+'</td>';}).join('')+'<td class="sep">'+M.tot.vis+'</td><td>'+fmt(M.tot.seg)+'</td></tr>';

    '<p class="control">Control: se cargaron '+M.cargadas+(M.cargadas===1?' ingreso':' ingresos')+'; '+M.delMes+(M.delMes===1?' tiene':' tienen')+' la entrada en este mes'+(otros?' (los otros '+otros+' son de otros meses)':'')+' y equivalen a '+M.tot.vis+(M.tot.vis===1?' visita':' visitas')+'. Varios ingresos de la misma autoridad en un día cuentan como una sola visita. La primera y la última semana pueden quedar incompletas.</p>'+
    '<p class="control"><strong>Días con presencia:</strong> días del mes en que la autoridad estuvo en el objetivo en algún momento, aunque no haya ingresado ese día. Por ejemplo, una permanencia que entra el 11 y sale el 13 suma 1 visita (el día 11) y 3 días con presencia (11, 12 y 13).</p>';
}

var FRA=(function(){
var NOMBRE='Cantidad de visitas por franja horaria';

var S={visitas:[],total:0,thr:2,sup:''};
var NOTA_TOTAL='El total del día cuenta a cada autoridad una sola vez; si estuvo en dos franjas el mismo día, figura en ambas franjas.';

function franjaDe(ms){var h=new Date(ms).getUTCHours();return h>=6&&h<14?0:(h>=14&&h<22?1:2);}
function procesarFilas(filas){
  var issues=[]; S.visitas=[]; S.total=filas.length;
  filas.forEach(function(f){
    var p=leerSupervisor(f.rest);
    if(!p){issues.push('Fila '+f.n+': falta el nombre de la autoridad (tercera columna).');return;}
    S.visitas.push({a:f.a,b:f.b,n:f.n,nombre:p.nombre,dni:p.dni,key:p.key});

function mesesConDatos(){

}
function supervisores(){

  return Array.from(map.entries()).sort(function(a,b){return a[1].localeCompare(b[1],'es');});
}
function nombreSup(){var r=supervisores().filter(function(x){return x[0]===S.sup;})[0];return r?r[1]:'';}
function modelo(){
  var y=state.year, m=state.month, n=new Date(Date.UTC(y,m+1,0)).getUTCDate(), rows=[], tot=[0,0,0], totalMes=0, delMes=0, filtradas=0, sets=[];
  for(var d=1;d<=n;d++){ rows.push({d:d,wd:(new Date(Date.UTC(y,m,d)).getUTCDay()+6)%7,f:[0,0,0],total:0}); sets.push({s:new Set(),f:[new Set(),new Set(),new Set()]}); }
  S.visitas.forEach(function(v){
    var dt=new Date(v.a); if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m) return;
    delMes++;
    if(S.sup&&v.key!==S.sup) return;

  /* una autoridad cuenta una vez por día (total del día) y una vez por franja: varios ingresos en la misma franja del mismo día son 1 */
  rows.forEach(function(r,i){ var q=sets[i]; r.total=q.s.size; for(var k=0;k<3;k++){r.f[k]=q.f[k].size;tot[k]+=r.f[k];} totalMes+=r.total; });

   VARIABLE 4: Cuadro de cumplimiento mensual

var CUM=(function(){

function mesesConDatos(){

/* =====================================================================
   VARIABLE 5: Informe trimestral, semestral y anual
   Se arma subiendo los Excel mensuales del Cuadro de cumplimiento
   (los que baja esta misma herramienta): cada uno lleva sus datos en
   una hoja oculta, que acá se leen y se suman.
   ===================================================================== */
var IPD=(function(){
var NOMBRE='Informe trimestral, semestral y anual';
var HOJA='datos_cumplimiento', MARCA='CUADRO_CUMPLIMIENTO_V1';
var FRANJAS=['06:00 a 14:00 hs.','14:00 a 22:00 hs.','22:00 a 06:00 hs.'];
var CAL={MST:{t:'Muy satisfactorias (MST)',c:'verdeosc'},SAT:{t:'Satisfactorias (SAT)',c:'verde'},PST:{t:'Poco satisfactorias (PST)',c:'amarillo'},NST:{t:'No satisfactorias (NST)',c:'rojo'}};
var PK=['meta','cel','tMST','tSAT','tPST','nSAT','nPST','dMST','dSAT','dPST'];
var TIPOS={
  trimestral:{k:3,lbl:['1° Trimestre','2° Trimestre','3° Trimestre','4° Trimestre'],rango:['Ene – Mar','Abr – Jun','Jul – Sep','Oct – Dic'],adj:'trimestral'},
  semestral:{k:6,lbl:['1° Semestre','2° Semestre'],rango:['Ene – Jun','Jul – Dic'],adj:'semestral'},
  anual:{k:12,lbl:['Año'],rango:['Ene – Dic'],adj:'anual'}
};
var S={meses:new Map(),avisos:[],tipo:'trimestral',per:0};

function calif(v,mst,sat,pst){return (mst!==null&&v>=mst)?'MST':(v>=sat?'SAT':(v>=pst?'PST':'NST'));}
function estPct(p){return p===null?'amarillo':(p<0.5?'rojo':(p<0.9?'amarillo':(p<2?'verde':'verdeosc')));}
function pct0(p){return p===null?'-':Math.round(p*100)+' %';}
function dec(x){return x.toFixed(1).replace('.',',');}
function varTxt(v){return v===null?'-':(v>0?'+':'')+(v*100).toFixed(1).replace('.',',')+' %';}
function sum(a){return a.reduce(function(x,y){return x+y;},0);}

/* ---- lectura de los Excel mensuales ---- */
function leerLibro(wb,nombre){
  var ws=wb.getWorksheet(HOJA);
  if(!ws) return {err:'no es un Excel del Cuadro de cumplimiento mensual de esta herramienta (falta la hoja de datos).'};
  var kv={}, g=[];
  ws.eachRow(function(row){
    var k=row.getCell(1).value; if(k===null||k===undefined) return; k=String(k);
    if(/^g[012]$/.test(k)){ var r=[]; for(var j=2;j<=8;j++) r.push(row.getCell(j).value); g[+k.charAt(1)]=r; }
    else kv[k]=row.getCell(2).value;
  });
  if(kv.marca!==MARCA) return {err:'no es un Excel del Cuadro de cumplimiento mensual de esta herramienta (marca no reconocida).'};
  var y=+kv.anio, m=+kv.mes, P={}, ok=true;
  if(!(y>=2000&&y<=2100)||!(m>=0&&m<=11)||kv.anio===null||kv.mes===null) return {err:'los datos del mes están incompletos.'};
  PK.forEach(function(k){var v=kv['p_'+k]; if(typeof v!=='number'||v<0) ok=false; P[k]=v;});
  if(!ok) return {err:'los criterios guardados en el archivo están incompletos.'};
  if(g.length!==3||g.some(function(r){return !r||r.length!==7||r.some(function(x){return typeof x!=='number'||x<0||Math.round(x)!==x;});})) return {err:'la grilla de visitas guardada en el archivo está incompleta.'};
  if(typeof kv.total!=='number'||kv.total<0) return {err:'el total del mes guardado en el archivo no es válido.'};
  var tf=g.map(sum), dist=0; g.forEach(function(r){r.forEach(function(n){if(n>0)dist++;});});
  return {d:{y:y,m:m,obj:kv.objetivo?String(kv.objetivo):'',P:P,g:g,tf:tf,total:kv.total,noct:tf[2],dist:dist,archivo:nombre}};
}
/* archivos: [{name, buf}] */
async function cargarArchivos(archivos){
  var avisos=[];
  for(var i=0;i<archivos.length;i++){
    var a=archivos[i];
    try{
      var wb=new ExcelJS.Workbook(); await wb.xlsx.load(a.buf);
      var r=leerLibro(wb,a.name);
      if(r.err){avisos.push('"'+a.name+'": '+r.err);continue;}
      var d=r.d, k=d.y*12+d.m;
      if(S.meses.has(k)) avisos.push('Ya había un archivo de '+MESES[d.m].toLowerCase()+' '+d.y+' ("'+S.meses.get(k).archivo+'"); se reemplazó por "'+a.name+'".');
      S.meses.set(k,d);
    }catch(e){ avisos.push('"'+a.name+'": no se pudo leer como archivo de Excel.'); }
  }
  S.avisos=avisos;
  /* si el año elegido no tiene meses cargados, saltar al año más reciente */
  if(S.meses.size>0&&!Array.from(S.meses.values()).some(function(d){return d.y===state.year;})){
    var ys=Array.from(S.meses.values()).map(function(d){return d.y;}); state.year=Math.max.apply(null,ys); $('anio').value=String(state.year);
    S.avisos.push('El año elegido no tenía meses cargados, así que se cambió a '+state.year+'.');
  }
  renderTodo();
}

/* ---- cálculo ---- */
function mesesDe(tipo,per){var k=TIPOS[tipo].k, a=tipo==='anual'?0:per*k, r=[]; for(var i=a;i<a+k;i++) r.push(i); return r;}
function agregar(y,idx){
  var con=[], faltan=[];
  idx.forEach(function(mi){var d=S.meses.get(y*12+mi); if(d) con.push(d); else faltan.push(mi);});
  var n=con.length, tf=[0,1,2].map(function(f){return sum(con.map(function(d){return d.tf[f];}));});
  var total=sum(con.map(function(d){return d.total;})), meta=sum(con.map(function(d){return d.P.meta;})), distS=sum(con.map(function(d){return d.dist;}));
  var P=n?con[con.length-1].P:null, avgT=n?total/n:null, avgN=n?tf[2]/n:null, avgD=n?distS/n:null;
  return {con:con,faltan:faltan,n:n,tf:tf,total:total,meta:meta,pct:meta>0?total/meta:null,avgT:avgT,avgN:avgN,avgD:avgD,P:P,
    cT:n?calif(avgT,P.tMST,P.tSAT,P.tPST):null,cN:n?calif(avgN,null,P.nSAT,P.nPST):null,cD:n?calif(avgD,P.dMST,P.dSAT,P.dPST):null,
    difP:n?con.some(function(d){return PK.some(function(k){return d.P[k]!==P[k];});}):false};
}

    doc.setFontSize(9.5); doc.text('Barrio: '+(o||'-')+(sub?'   ·   '+sub:''),x0,21); y=26;
  }
  function rotulo(t){doc.setTextColor(28,42,53);doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.text(t,x0,y);y+=2.5;}
  function caja(x,yy,w,h,c,fs,gris){
    var col=c.k?RGB[c.k]:(gris?[223,230,235]:[255,255,255]); doc.setFillColor(col[0],col[1],col[2]); doc.rect(x,yy,w,h,'FD');
    doc.setFont('helvetica',(c.b||gris)?'bold':'normal'); doc.setFontSize(fs);
    if(c.k==='verdeosc') doc.setTextColor(255,255,255); else doc.setTextColor(28,42,53);
    var t=c.t; while(t.length>1&&doc.getTextWidth(t)>w-2) t=t.slice(0,-1);
    if(c.izq) doc.text(t,x+1.5,yy+h/2+1.1); else doc.text(t,x+w/2,yy+h/2+1.1,{align:'center'});
  }
  function grilla(w,cab,filas,pie,fs){
    fs=fs||7; var x=x0, tw=w.reduce(function(a,b){return a+b;},0); if(tw<277){var f=277/tw; w=w.map(function(v){return v*f;});}
    cab.forEach(function(t,j){caja(x,y,w[j],rh+1.2,cT(t,{izq:j===0,b:1}),fs-0.5,true);x+=w[j];}); y+=rh+1.2;
    filas.concat(pie?[pie]:[]).forEach(function(f){x=x0;f.forEach(function(c,j){caja(x,y,w[j],rh,c,fs,!!c.g);x+=w[j];});y+=rh;});
    y+=6;
  }
  if(inc.informe){
    pag(R.titulo,R.cur.n?'Meses con carga: '+R.cur.n+' de '+TIPOS[R.tipo].k:'');
    if(!R.cur.n){ doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.text('No hay meses cargados para este período.',x0,y+4); }
    else{
      var B=bloqueResumen(R);
      rotulo('Visitas del período'); grilla([45,45,45,30,40,40],FRANJAS.concat(['Total','Meta del período','% cumpl. meta']),B.A,null,8);
      rotulo('Calificación según el promedio mensual');
      grilla([84,26,50,117],['Indicador','Valor','Calificación','Criterio'],B.B.map(function(f){return f.map(function(c){return c;});}),null,7);
      rotulo('Detalle de los meses del período'); grilla(TB.detalle.w,TB.detalle.cab,R.filas.map(TB.detalle.fila),null,7);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(28,42,53); doc.text(LEY_CAL,x0,y-3);
      var E=extras(R);
      if(E){
        pag(R.titulo,'Meses con carga: '+R.cur.n+' de '+TIPOS[R.tipo].k);
        rotulo('Distribución de calificaciones mensuales (Totales)'); grilla([80,50,60],['Calificación','Cantidad de meses','% sobre meses con carga'],E.dist,null,8);
        rotulo('Indicadores destacados del año'); grilla([100,60,40],['Indicador','Resultado','Valor'],E.ind,null,8);
      }
    }
  }
  if(inc.evolucion){
    var V=evolucion(); pag(V.titulo,'');
    var pie=pieEvol(V);
    grilla(TB.evol.w,TB.evol.cab,V.rows.map(TB.evol.fila),pie,7);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(28,42,53);
    doc.text(LEY_CAL+'. Los meses sin datos no se consideran en los totales ni en las calificaciones.',x0,y-3);
  }
}

return {
  id:'periodo', nombre:NOMBRE, archivo:'informe', sinMes:true, cargaPropia:true,
  tabResumen:'Informe del período', tabCalendario:'Evolución mensual',
  ayudaCarga:'Subí los Excel mensuales del Cuadro de cumplimiento que descargó esta herramienta (uno por mes, de los meses del período). Los archivos se leen en tu navegador y no se envían a ningún lado.',
  etiquetaPegado:'', placeholder:'', botonResumen:'Ver informe del período',
  etiqueta:['mes cargado','meses cargados'], palabraOtros:'meses',
  mensajeVacio:'', textoVacio:'Todavía no hay meses cargados. Subí los Excel mensuales en la solapa Carga de datos para ver esta información.',
  controlesHtml:controlesHtml(), iniciarControles:iniciarControles, ayudaHtml:ayudaHtml,
  procesar:function(){return [];}, n:function(){return S.meses.size;}, hayDatos:function(){return S.meses.size>0;},
  estadoPropio:function(){var n=S.meses.size,R=informe();return NOMBRE+' · '+R.titulo.replace(/^Informe /,'')+': '+(n===0?'sin meses cargados.':n+(n===1?' mes cargado.':' meses cargados.'));},
  nombreBase:function(){var R=informe();return 'informe_'+R.tipo+(R.tipo==='anual'?'':'_'+(R.per+1))+'_'+R.y;},
  mesesConDatos:function(){return new Map();}, avisosCarga:function(){return [];}, preview:function(){return '';},
  renderCargaPropia:renderCargaPropia,
  renderResumen:renderResumen, renderCalendario:renderCalendario,
  secciones:[{id:'informe',label:'Informe del período (solapa 3)'},{id:'evolucion',label:'Evolución mensual del año (solapa 4)'}],
  xlsx:xlsx, pdf:pdf, reiniciar:function(){},
  _cargar:cargarArchivos, _informe:informe, _evolucion:evolucion, _S:S
};
})();
VARS.periodo=IPD;

/* ---------- arranque ---------- */
Object.keys(VARS).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=VARS[k].nombre;$('variable').appendChild(o);});
$('variable').value=state.varId;
renderVariable();
renderTodo();
window.__app={state:state,VARS:VARS,procesar:procesar,renderTodo:renderTodo,goTab:goTab};
})();
</script>
