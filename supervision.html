<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supervisión del objetivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2a35; --ink-2:#51616e; --paper:#eef1f3; --panel:#ffffff; --head:#dfe6eb; --line:#c5cfd6;
  --accent:#1e5b78; --accent-ink:#ffffff; --focus:#0a7bb5;
  --rojo:#f26d6d; --amarillo:#f6d860; --verde:#5cb87a; --violeta:#b9a7ef; --violeta-2:#d6cbf7; --cell-ink:#1c2a35;
  --f-head:'Barlow Semi Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --f-body:'Barlow','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6ecf0; --ink-2:#9fb0bc; --paper:#141b21; --panel:#1b242b; --head:#26333c; --line:#36444e;
    --accent:#6bb6d6; --accent-ink:#0f1a20; --focus:#7cc7e8;
  }
}
:root[data-theme="dark"]{
  --ink:#e6ecf0; --ink-2:#9fb0bc; --paper:#141b21; --panel:#1b242b; --head:#26333c; --line:#36444e;
  --accent:#6bb6d6; --accent-ink:#0f1a20; --focus:#7cc7e8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{max-width:1120px;margin:0 auto;padding:28px 20px 56px}
header.top{padding-bottom:18px}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(1.7rem,3.4vw,2.3rem);line-height:1.1;margin:0 0 6px;letter-spacing:.005em}
#estado{margin:0;color:var(--ink-2)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px 11px;background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;color:var(--ink-2);font-family:var(--f-head);font-weight:600;font-size:1.05rem;white-space:nowrap}
.tab .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;font-size:.82rem;font-weight:600}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.panel{background:var(--panel);border:1px solid var(--line);border-top:0;padding:26px 24px 30px}
.panel h2{font-family:var(--f-head);font-weight:700;font-size:1.5rem;margin:0 0 4px}
.lead{margin:0 0 20px;color:var(--ink-2);max-width:62ch}

.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px 22px;max-width:820px}
.campos label{display:flex;flex-direction:column;gap:6px;font-weight:500}
.campos .ancho{grid-column:1/-1}
select,input[type=number],textarea{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:9px 10px;width:100%}
textarea{font-family:var(--f-body);font-variant-numeric:tabular-nums;resize:vertical;min-height:170px;line-height:1.45}
.ayuda{color:var(--ink-2);font-size:.95rem;margin:16px 0 0;max-width:70ch}
.acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}

button.primario,button.sec{border-radius:3px;padding:10px 18px;font-weight:600;cursor:pointer;border:1.5px solid var(--accent)}
button.primario{background:var(--accent);color:var(--accent-ink)}
button.primario:hover{filter:brightness(1.08)}
button.sec{background:transparent;color:var(--accent)}
button.sec:hover{background:var(--head)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}

.mensajes{margin-top:16px;display:grid;gap:8px}
.aviso{border-left:4px solid var(--accent);background:var(--paper);padding:10px 14px;max-width:80ch}
.aviso.mal{border-left-color:var(--rojo)}
.aviso.atencion{border-left-color:var(--amarillo)}
.aviso ul{margin:6px 0 0;padding-left:20px}
.aviso button{margin-left:6px;margin-top:4px}

.scroll{overflow:auto;max-width:100%;border:1px solid var(--line)}
.scroll.alto{max-height:340px}
table.tabla{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tabla th,.tabla td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tabla th{background:var(--head);font-family:var(--f-head);font-weight:600;position:sticky;top:0}
.tabla td.izq,.tabla th.izq{text-align:left}
.tabla tfoot td{font-weight:700;background:var(--head)}
.tabla .cero{color:var(--ink-2)}
.control{margin:14px 0 0;color:var(--ink-2);font-size:.95rem}

.leyenda{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 16px;align-items:center}
.leyenda span.item{display:inline-flex;align-items:center;gap:8px}
.muestra{width:18px;height:18px;border:1px solid rgba(0,0,0,.25);display:inline-block}
.muestra.rojo{background:var(--rojo)}.muestra.amarillo{background:var(--amarillo)}.muestra.verde{background:var(--verde)}
.opcion{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.opcion input{width:18px;height:18px;accent-color:var(--accent)}

.cal-wrap{overflow-x:auto;max-width:100%}
.cal-titulo{font-family:var(--f-head);font-weight:700;font-size:1.35rem;margin:0 0 10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:760px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dia{border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.dia.vacio{background:var(--paper);opacity:.55}
.dia-h{font-family:var(--f-head);font-weight:600;text-align:center;padding:5px 6px;background:var(--head)}
.fr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;font-size:.92rem;color:var(--cell-ink);border-top:1px solid rgba(28,42,53,.2);font-variant-numeric:tabular-nums}
.fr.rojo{background:var(--rojo)}.fr.amarillo{background:var(--amarillo)}.fr.verde{background:var(--verde)}
.fr .t{font-weight:600}
.fr.revisar{background:repeating-linear-gradient(135deg,var(--violeta) 0 9px,var(--violeta-2) 9px 18px)}
.muestra.revisar{background:repeating-linear-gradient(135deg,var(--violeta) 0 5px,var(--violeta-2) 5px 10px)}
.tabla td.revisar{background:repeating-linear-gradient(135deg,var(--violeta) 0 9px,var(--violeta-2) 9px 18px);color:#1c2a35;font-weight:600}
.tabla td.wrap{white-space:normal;min-width:180px}
.cortes{margin-top:26px}
button.chico{padding:5px 11px;font-size:.9rem}
.tabla td.acc{white-space:nowrap}
.est{display:inline-flex;align-items:center;gap:6px;font-weight:500}
input.ed{width:100%;min-width:158px;font-variant-numeric:tabular-nums;padding:5px 7px;background:var(--paper);border:1px solid var(--line);border-radius:3px}
#banner{margin:0 0 14px}
.cortes h3{font-family:var(--f-head);font-weight:700;font-size:1.2rem;margin:0 0 6px}
.cortes p{margin:0 0 12px;color:var(--ink-2);max-width:78ch}

.vacio-msg{padding:26px 22px;border:1px dashed var(--line);max-width:640px}
.vacio-msg p{margin:0 0 14px}
.grupo{border:0;padding:0;margin:0 0 22px}
.grupo legend{font-family:var(--f-head);font-weight:600;font-size:1.1rem;padding:0;margin-bottom:8px}
.grupo .opcion{display:flex;margin-bottom:6px}
#msg-descarga{margin-top:16px;min-height:1.5em}

@media (max-width:640px){
  .app{padding:18px 12px 40px}
  .panel{padding:20px 14px 24px}
  .tab{padding:10px 12px 9px;font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.subtitulo{font-family:var(--f-head);font-weight:700;font-size:1.2rem;margin:26px 0 8px}
.subtitulo:first-child{margin-top:0}
.tabla th small{font-weight:400;color:var(--ink-2);display:block}
.tabla td.sep,.tabla th.sep{border-left:2px solid var(--line)}
.sin-cal{padding:22px;border:1px dashed var(--line);max-width:640px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="titulo">Supervisión del objetivo</h1>
    <p id="estado" aria-live="polite"></p>
    <div id="banner" class="aviso" role="status" hidden></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Pasos del análisis">
    <button class="tab" role="tab" id="tab-1" aria-controls="panel-1" aria-selected="true"><span class="n">1</span><span>Mes y variable</span></button>
    <button class="tab" role="tab" id="tab-2" aria-controls="panel-2" aria-selected="false" tabindex="-1"><span class="n">2</span><span>Carga de datos</span></button>
    <button class="tab" role="tab" id="tab-3" aria-controls="panel-3" aria-selected="false" tabindex="-1"><span class="n">3</span><span id="tl-3">Resumen</span></button>
    <button class="tab" role="tab" id="tab-4" aria-controls="panel-4" aria-selected="false" tabindex="-1"><span class="n">4</span><span id="tl-4">Calendario</span></button>
    <button class="tab" role="tab" id="tab-5" aria-controls="panel-5" aria-selected="false" tabindex="-1"><span class="n">5</span><span>Descargas</span></button>
  </div>

  <section class="panel" id="panel-1" role="tabpanel" aria-labelledby="tab-1">
    <h2>Mes y variable</h2>
    <p class="lead">Elegí el mes que querés analizar y la variable que se va a calcular.</p>
    <div class="campos">
      <label>Mes
        <select id="mes"></select>
      </label>
      <label>Año
        <input id="anio" type="number" min="2000" max="2100" step="1">
      </label>
      <label class="ancho">Variable
        <select id="variable"></select>
      </label>
      <span id="mod-controles" style="display:contents"></span>
    </div>
    <p class="ayuda" id="ayuda-var"></p>
    <div class="acciones">
      <button class="primario" data-goto="2">Continuar con la carga de datos</button>
    </div>
  </section>

  <section class="panel" id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden>
    <h2>Carga de datos</h2>
    <p class="lead" id="lead-2"></p>
    <label for="pegado" id="lbl-pegado" style="font-weight:500;display:block;margin-bottom:6px"></label>
    <textarea id="pegado" spellcheck="false"></textarea>
    <div class="acciones">
      <button class="primario" id="btn-ver-resumen" disabled>Ver resumen</button>
      <button class="sec" id="btn-limpiar">Borrar datos</button>
    </div>
    <div class="mensajes" id="mensajes" aria-live="polite"></div>
    <div id="preview" style="margin-top:20px"></div>
  </section>

  <section class="panel" id="panel-3" role="tabpanel" aria-labelledby="tab-3" hidden>
    <h2 id="h-3">Resumen</h2>
    <p class="lead" id="lead-3"></p>
    <div id="resumen"></div>
  </section>

  <section class="panel" id="panel-4" role="tabpanel" aria-labelledby="tab-4" hidden>
    <h2 id="h-4">Calendario</h2>
    <div id="calendario"></div>
  </section>

  <section class="panel" id="panel-5" role="tabpanel" aria-labelledby="tab-5" hidden>
    <h2>Descargas</h2>
    <p class="lead">Elegí qué querés incluir y en qué formato lo querés descargar.</p>
    <fieldset class="grupo">
      <legend>Qué incluir</legend>
      <div id="desc-opciones"></div>
    </fieldset>
    <div class="acciones">
      <button class="primario" id="btn-xlsx" disabled>Descargar Excel (.xlsx)</button>
      <button class="primario" id="btn-pdf" disabled>Descargar PDF</button>
    </div>
    <p id="msg-descarga" aria-live="polite"></p>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   NÚCLEO: utilidades, lectura de lo pegado, solapas, descargas
   Cada variable es un módulo independiente (ver VARS al final).
   Un módulo define: nombre, textos de ayuda, procesar(), resumen,
   calendario (opcional), y qué sale en Excel y PDF.
   ===================================================================== */
var DAY=86400000;
var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
var RGB={rojo:[242,109,109],amarillo:[246,216,96],verde:[92,184,122],revisar:[185,167,239]};
var ARGB={rojo:'FFF26D6D',amarillo:'FFF6D860',verde:'FF5CB87A',revisar:'FFB9A7EF'};

var hoy=new Date();
var state={varId:'permanencia',month:hoy.getMonth(),year:hoy.getFullYear(),filas:[],issues:[],issuesMod:[],skipped:0,notice:'',incl:{}};
var VARS={};
function mod(){return VARS[state.varId];}

function $(id){return document.getElementById(id);}
function pad2(n){return (n<10?'0':'')+n;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(s){ s=Math.round(s); var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return pad2(h)+':'+pad2(m)+':'+pad2(x); }
function fmtCero(s){return Math.round(s)===0?'-':fmt(s);}
function fmtFechaHora(ms){var d=new Date(ms);return pad2(d.getUTCDate())+'/'+pad2(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()+' '+pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes())+':'+pad2(d.getUTCSeconds());}
function fmtFecha(y,m,d){return pad2(d)+'/'+pad2(m+1)+'/'+y;}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_');}

/* ---------- lectura de lo pegado (común a todas las variables) ---------- */
var RX=/(\d{1,2})\/(\d{1,2})\/(\d{4})[\sT,;]+(\d{1,2}):(\d{2})(?::(\d{2}))?/g;
var RX1=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*$/;
function toMs(m){
  var d=+m[1],mo=+m[2],y=+m[3],h=+m[4],mi=+m[5],s=m[6]?+m[6]:0;
  if(mo<1||mo>12||d<1||h>23||mi>59||s>59) return NaN;
  var t=Date.UTC(y,mo-1,d,h,mi,s), dt=new Date(t);
  if(dt.getUTCDate()!==d||dt.getUTCMonth()!==mo-1) return NaN;
  return t;
}
function parseUna(str){var m=RX1.exec(str);return m?toMs(m):NaN;}
/* Cada fila válida tiene entrada (a), salida (b), número de fila (n) y "rest": el texto de las columnas que siguen (con tabuladores). */
function leerFilas(text){
  var filas=[],issues=[],skipped=0;
  text.split(/\r?\n/).forEach(function(raw,i){
    var line=raw.trim(); if(!line) return;
    var n=i+1, ms=Array.from(line.matchAll(RX));
    if(ms.length===0){
      if(!/\d/.test(line)){skipped++;return;}
      issues.push('Fila '+n+': no se encontró una fecha con formato dd/mm/aaaa hh:mm:ss.'); return;
    }
    if(ms.length===1){issues.push('Fila '+n+': falta la fecha de salida (se necesitan dos columnas).');return;}
    var a=toMs(ms[0]), b=toMs(ms[1]);
    if(isNaN(a)||isNaN(b)){issues.push('Fila '+n+': fecha u hora no válida.');return;}
    if(b<a){issues.push('Fila '+n+': la salida es anterior a la entrada.');return;}
    var rest=line.slice(ms[1].index+ms[1][0].length).replace(/^[\s;,]+/,'');
    filas.push({a:a,b:b,n:n,rest:rest});
  });
  return {filas:filas,issues:issues,skipped:skipped};
}


function norm(t){return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();}
/* El resto de la fila trae el supervisor y el DNI (separados por tabulador al copiar desde Excel). */
function leerSupervisor(rest){
  var t=(rest||'').replace(/^[\s;,]+/,'').trim(); if(!t) return null;
  var parts=t.split(/\s*\t+\s*/).filter(function(x){return x;}), nombre='', dni='';
  if(parts.length>=2){ nombre=parts[0]; var d=parts[1].replace(/[.\s]/g,''); if(/^\d{6,10}$/.test(d)) dni=d; }
  else { var m=/^(.*?)[\s,;]+(\d[\d.]{5,11})$/.exec(t); if(m){nombre=m[1].trim();dni=m[2].replace(/\./g,'');} else nombre=t; }
  nombre=nombre.replace(/\s+/g,' ').trim(); if(!nombre) return null;
  return {nombre:nombre,dni:dni,key:dni||norm(nombre)};
}

var bannerTmr=null;
function banner(msg){var b=$('banner');b.textContent=msg;b.hidden=false;clearTimeout(bannerTmr);bannerTmr=setTimeout(function(){b.hidden=true;},9000);}

/* ---------- procesamiento ---------- */
function procesar(){
  var res=leerFilas($('pegado').value);
  state.filas=res.filas; state.issues=res.issues; state.skipped=res.skipped;
  procesarModulo();
}
function procesarModulo(){
  var m=mod();
  state.issuesMod=m.procesar(state.filas)||[];
  state.notice='';
  var byMonth=m.mesesConDatos(), selKey=state.year*12+state.month;
  if(byMonth.size>0 && !(byMonth.get(selKey)>0)){
    var best=null;
    byMonth.forEach(function(s,k){if(best===null||s>byMonth.get(best)) best=k;});
    if(best!==null){
      state.year=Math.floor(best/12); state.month=best%12;
      state.notice='El mes seleccionado no tenía datos, así que se cambió a '+MESES[state.month]+' '+state.year+'.';
      $('mes').value=String(state.month); $('anio').value=String(state.year);
    }
  }
  renderTodo();
}

/* ---------- pantallas ---------- */
function vacioHtml(){
  return '<div class="vacio-msg"><p>Todavía no hay datos cargados. Pegá los registros en la solapa Carga de datos para ver esta información.</p><button class="primario" data-goto="2">Ir a carga de datos</button></div>';
}
function renderVariable(){
  var m=mod();
  $('tl-3').textContent=m.tabResumen; $('h-3').textContent=m.tabResumen;
  $('tl-4').textContent=m.tabCalendario||'Calendario'; $('h-4').textContent=m.tabCalendario||'Calendario';
  $('lead-2').textContent=m.ayudaCarga; $('lbl-pegado').textContent=m.etiquetaPegado;
  $('pegado').placeholder=m.placeholder; $('btn-ver-resumen').textContent=m.botonResumen;
  $('mod-controles').innerHTML=m.controlesHtml||'';
  if(m.iniciarControles) m.iniciarControles();
}
function renderEstado(){
  var m=mod();
  $('estado').textContent=m.nombre+' · '+MESES[state.month]+' '+state.year+': '+m.estadoTxt();
  $('ayuda-var').innerHTML=m.ayudaHtml();
}
function renderCarga(){
  var m=mod(), msgs=[], n=m.n();
  if($('pegado').value.trim()===''){ $('mensajes').innerHTML=''; $('preview').innerHTML=''; $('btn-ver-resumen').disabled=true; return; }
  var iss=state.issues.concat(state.issuesMod);
  if(n>0) msgs.push('<div class="aviso">Se leyeron <strong>'+n+'</strong> '+(n===1?m.etiqueta[0]:m.etiqueta[1])+'.'+(state.skipped?' Se omitió la fila de encabezado.':'')+'</div>');
  if(iss.length){
    var li=iss.slice(0,12).map(function(t){return '<li>'+esc(t)+'</li>';}).join('');
    var mas=iss.length>12?'<li>Y '+(iss.length-12)+' más.</li>':'';
    msgs.push('<div class="aviso mal"><strong>'+iss.length+(iss.length===1?' fila descartada':' filas descartadas')+'.</strong><ul>'+li+mas+'</ul></div>');
  }
  if(n===0 && !iss.length) msgs.push('<div class="aviso atencion">'+m.mensajeVacio+'</div>');
  if(state.notice) msgs.push('<div class="aviso atencion">'+esc(state.notice)+'</div>');
  (m.avisosCarga?m.avisosCarga():[]).forEach(function(h){msgs.push(h);});
  var byMonth=m.mesesConDatos(), selKey=state.year*12+state.month, otros=[];
  byMonth.forEach(function(s,k){if(k!==selKey&&s>0) otros.push(k);});
  if(otros.length){
    otros.sort(function(a,b){return a-b;});
    var btns=otros.slice(0,4).map(function(k){return '<button class="sec" data-mes="'+k+'">Ver '+MESES[k%12].toLowerCase()+' '+Math.floor(k/12)+'</button>';}).join(' ');
    msgs.push('<div class="aviso atencion">Los datos incluyen '+m.palabraOtros+' de otros meses, que no se cuentan en '+MESES[state.month].toLowerCase()+'. '+btns+'</div>');
  }

var fino={style:'thin',color:{argb:'FF9AA7B2'}};
var XL={borde:{top:fino,left:fino,bottom:fino,right:fino},centro:{horizontal:'center',vertical:'middle'},TF:'[h]:mm:ss;-[h]:mm:ss;"-"',
        gris:{type:'pattern',pattern:'solid',fgColor:{argb:'FFDFE6EB'}}};
/* Tabla con encabezados (con celdas combinadas), cuerpo y fila de totales; salta de página si hace falta. */
function pdfGrid(doc,y,cw,headRows,body,foot,opt){
  opt=opt||{}; var x0=opt.x0||10, rh=7, GRIS=[223,230,235], maxY=opt.maxY||200, orient=opt.orient||'landscape', top=opt.top||15;
  doc.setDrawColor(150,163,174); doc.setLineWidth(0.2); doc.setFontSize(8); doc.setTextColor(28,42,53);
  function recortar(txt,ancho){var e=txt||'';while(e.length>0&&doc.getTextWidth(e)>ancho-3)e=e.slice(0,-1);if(e.length<(txt||'').length)e=e.slice(0,-1)+'...';return e;}
  function fila(cells,fill,bold){
    var x=x0, ci=0;
    cells.forEach(function(c){
      var cell=(typeof c==='object')?c:{t:c,span:1}, span=cell.span||1, w=0;
      for(var k=0;k<span;k++) w+=cw[ci+k];
      if(fill){doc.setFillColor(fill[0],fill[1],fill[2]);doc.rect(x,y,w,rh,'FD');} else doc.rect(x,y,w,rh,'S');
      doc.setFont('helvetica',bold?'bold':'normal');
      var first=(ci===0), t=recortar(String(cell.t),w);
      doc.text(t,first?x+2:x+w/2,y+rh/2+1.2,first?{}:{align:'center'});
      x+=w; ci+=span;
    });
    y+=rh;
  }
  function cabeceras(){headRows.forEach(function(h){fila(h,GRIS,true);});}
  cabeceras();
  body.forEach(function(r){ if(y+rh>maxY){doc.addPage('a4',orient);y=top;cabeceras();} fila(r,null,false); });
  if(foot){ if(y+rh>maxY){doc.addPage('a4',orient);y=top;cabeceras();} fila(foot,GRIS,true); }
  return y;
}

/* =====================================================================
   VARIABLE 1: Tiempo de permanencia en el objetivo
   (la lógica de franjas, calendario, cortes por medianoche y controles)
   ===================================================================== */
var PERM=(function(){
var FRANJAS=['06:00 - 14:00 hs.','14:00 - 22:00 hs.','22:00 - 06:00 hs.'];
var WINDOWS=[[0,6,2],[6,14,0],[14,22,1],[22,24,2]];   // [hora desde, hora hasta, índice de franja]
var VARIABLE='Tiempo de permanencia en el objetivo';
var GUIA_CORTES='Estas permanencias cruzan la medianoche, por eso se reparten entre dos días. Controlá si la persona realmente siguió en el objetivo después de las 00:00 o si fue una falla del sistema (por ejemplo, una salida que no se registró a tiempo).';
var S={thr:3,records:[],dist:new Map(),showTimes:false,cortes:[],nochesRev:new Set(),revisiones:{},log:[],editando:null,errorEdicion:'',edTxt:null};

function thrSeg(){return S.thr*3600;}
function thrTxt(){return String(S.thr).replace('.',',');}
function estado(s){s=Math.round(s);return s===0?'rojo':(s<thrSeg()?'amarillo':'verde');}
function estadoTxt(e){return e==='rojo'?'sin permanencia':(e==='amarillo'?'menos de '+thrTxt()+' h':thrTxt()+' h o más');}

/* ---------- reparto exacto por día y franja ---------- */
function distribute(records){
  var map=new Map();
  records.forEach(function(r){
    var t=r.a;
    while(t<r.b){
      var di=Math.floor(t/DAY), ds=di*DAY, end=Math.min(r.b,ds+DAY);
      var arr=map.get(di); if(!arr){arr=[0,0,0];map.set(di,arr);}
      WINDOWS.forEach(function(w){
        var lo=Math.max(t,ds+w[0]*3600000), hi=Math.min(end,ds+w[1]*3600000);
        if(hi>lo) arr[w[2]]+=(hi-lo)/1000;
      });
      t=end;
    }
  });
  return map;
}
function detectarCortes(records){
  var list=[], noches=new Set();
  records.forEach(function(r){
    var m=(Math.floor(r.a/DAY)+1)*DAY, first=m, cuts=0, days=[];
    while(m<r.b){
      cuts++; var di=Math.floor(m/DAY);
      noches.add(di-1); noches.add(di); days.push(di-1,di);
      m+=DAY;
    }
    if(cuts>0) list.push({key:r.a+'|'+r.b+'|'+(r.extra||''),n:r.n,a:r.a,b:r.b,extra:r.extra,cuts:cuts,days:days,antes:cuts===1?(first-r.a)/1000:null,despues:cuts===1?(r.b-first)/1000:null});
  });
  list.sort(function(x,y){return x.a-y.a;});
  return {list:list,noches:noches};
}
function cortesDelMes(M){
  var ini=Math.floor(Date.UTC(M.y,M.m,1)/DAY), fin=ini+M.n-1;
  return S.cortes.filter(function(c){return c.days.some(function(d){return d>=ini&&d<=fin;});});
}
function estadoCorte(c){var r=S.revisiones[c.key];return r?r.estado:'pendiente';}
function recalcRev(){
  S.nochesRev=new Set(); var hay=false;
  S.cortes.forEach(function(c){
    if(c.key===S.editando) hay=true;
    if(estadoCorte(c)==='pendiente') c.days.forEach(function(d){S.nochesRev.add(d);});
  });
  if(!hay){S.editando=null;S.errorEdicion='';S.edTxt=null;}
}
function pendientesDelMes(M){return cortesDelMes(M).filter(function(c){return estadoCorte(c)==='pendiente';});}
function correccionesVisibles(){
  var keys=new Set(S.records.map(function(r){return r.a+'|'+r.b+'|'+(r.extra||'');}));
  return S.log.filter(function(x){return keys.has(x.key);});
}
function txtEstado(c){var e=estadoCorte(c);return e==='pendiente'?'Pendiente':(e==='validado'?'Validado':'Corregido');}
function cortesHtml(M){

      var eb=ed?'<input class="ed ed-b" type="text" spellcheck="false" aria-label="Salida" value="'+esc(S.edTxt?S.edTxt.b:fmtFechaHora(c.b))+'">':fmtFechaHora(c.b);

      var acc=ed?'<button class="primario chico" data-acc="guardar">Guardar</button> <button class="sec chico" data-acc="cancelar">Cancelar</button>'
        :(est==='pendiente'?'<button class="primario chico" data-acc="validar">Validar</button> <button class="sec chico" data-acc="editar">Modificar</button>'
        :'<button class="sec chico" data-acc="reabrir">Reabrir</button>');
      return '<tr data-key="'+k+'"><td>'+c.n+'</td><td>'+ea+'</td><td>'+eb+'</td><td>'+fmt((c.b-c.a)/1000)+'</td><td>'+(c.antes===null?'varios cortes':fmt(c.antes))+'</td><td>'+(c.despues===null?'varios cortes':fmt(c.despues))+'</td><td class="izq wrap">'+(c.extra?esc(c.extra):'')+'</td><td>'+et+'</td><td class="acc">'+acc+'</td></tr>';

    out+='<h3>Cortes por medianoche ('+L.length+(L.length===1?': ':': ')+pend+(pend===1?' pendiente de revisión':' pendientes de revisión')+')</h3>'+
      '<p>'+GUIA_CORTES+' Si el corte es correcto, usá <strong>Validar</strong>. Si fue un error, usá <strong>Modificar</strong> para corregir la entrada o la salida: el cambio se aplica al texto pegado en la solapa 2 (no a tu Excel original) y queda registrado en las correcciones. Mientras estén pendientes, las franjas nocturnas de los dos días se ven en violeta.</p>'+
      (S.errorEdicion?'<div class="aviso mal" role="alert" style="margin-bottom:10px">'+esc(S.errorEdicion)+'</div>':'')+
      '<div class="scroll"><table class="tabla"><thead><tr><th>Fila pegada</th><th>Entrada</th><th>Salida</th><th>Permanencia</th><th>Hasta las 00:00</th><th>Desde las 00:00</th><th class="izq">Datos adicionales de la fila</th><th>Estado</th><th>Control</th></tr></thead><tbody>'+filas+'</tbody></table></div>';
  }
  if(corr.length){
    var f2=corr.map(function(x){
      return '<tr><td>'+x.n+'</td><td>'+fmtFechaHora(x.origA)+'</td><td>'+fmtFechaHora(x.origB)+'</td><td>'+fmtFechaHora(x.newA)+'</td><td>'+fmtFechaHora(x.newB)+'</td><td class="izq wrap">'+(x.extra?esc(x.extra):'')+'</td></tr>';
    }).join('');
    out+='<h3 style="margin-top:22px">Correcciones realizadas ('+corr.length+')</h3><p>Registros que se modificaron en esta pantalla. Los valores originales siguen en tu Excel.</p><div class="scroll"><table class="tabla"><thead><tr><th>Fila pegada</th><th>Entrada original</th><th>Salida original</th><th>Entrada corregida</th><th>Salida corregida</th><th class="izq">Datos adicionales de la fila</th></tr></thead><tbody>'+f2+'</tbody></table></div>';
  }
  return out+'</div>';
}
function segundosPorMes(map){
  var out=new Map();
  map.forEach(function(v,di){
    var d=new Date(di*DAY), key=d.getUTCFullYear()*12+d.getUTCMonth();
    out.set(key,(out.get(key)||0)+v[0]+v[1]+v[2]);
  });
  return out;
}
function monthModel(){
  var y=state.year, m=state.month, n=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  var rows=[], tot=[0,0,0];
  for(var d=1;d<=n;d++){
    var t=Date.UTC(y,m,d), v=S.dist.get(Math.floor(t/DAY))||[0,0,0];
    var wd=(new Date(t).getUTCDay()+6)%7;
    rows.push({d:d,wd:wd,f:v.slice(),total:v[0]+v[1]+v[2],rev:S.nochesRev.has(Math.floor(t/DAY))});
    for(var k=0;k<3;k++) tot[k]+=v[k];
  }
  return {y:y,m:m,n:n,rows:rows,tot:tot,total:tot[0]+tot[1]+tot[2]};
}
function semanas(M){
  var weeks=[], cur=new Array(7).fill(null);
  M.rows.forEach(function(r){
    cur[r.wd]=r;
    if(r.wd===6){weeks.push(cur);cur=new Array(7).fill(null);}
  });
  if(cur.some(function(x){return x;})) weeks.push(cur);
  return weeks;
}

function corta(d,m){return pad2(d)+'/'+pad2(m+1);}
function modelo(){
  var y=state.year, m=state.month, n=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  var fw=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7, nSem=Math.ceil((n+fw)/7), semanas=[];
  for(var w=0;w<nSem;w++) semanas.push({n:w+1,ini:Math.max(1,w*7-fw+1),fin:Math.min(n,(w+1)*7-fw)});
  var map=new Map(), delMes=0;
  S.visitas.forEach(function(v){
    var d=new Date(v.a); if(d.getUTCFullYear()!==y||d.getUTCMonth()!==m) return;
    delMes++;
    var s=map.get(v.key);
    if(!s){s={nombre:v.nombre,dni:v.dni,vis:0,seg:0,sem:semanas.map(function(){return {v:0,s:0};})};map.set(v.key,s);}
    var w=Math.floor((d.getUTCDate()-1+fw)/7), dur=(v.b-v.a)/1000;
    s.vis++; s.seg+=dur; s.sem[w].v++; s.sem[w].s+=dur;
    if(!s.dni&&v.dni) s.dni=v.dni;
  });
  var filas=Array.from(map.values()).sort(function(a,b){return a.nombre.localeCompare(b.nombre,'es');});
  var tot={vis:0,seg:0,sem:semanas.map(function(){return {v:0,s:0};})};
  filas.forEach(function(s){tot.vis+=s.vis;tot.seg+=s.seg;s.sem.forEach(function(x,i){tot.sem[i].v+=x.v;tot.sem[i].s+=x.s;});});

var FRA=(function(){
var NOMBRE='Cantidad de visitas por franja horaria';
var FRANJAS=['06:00 - 14:00 hs.','14:00 - 22:00 hs.','22:00 - 06:00 hs.'];
var S={visitas:[],total:0,thr:2,sup:''};

function franjaDe(ms){var h=new Date(ms).getUTCHours();return h>=6&&h<14?0:(h>=14&&h<22?1:2);}
function procesarFilas(filas){
  var issues=[]; S.visitas=[]; S.total=filas.length;
  filas.forEach(function(f){
    var p=leerSupervisor(f.rest);
    if(!p){issues.push('Fila '+f.n+': falta el nombre del supervisor (tercera columna).');return;}
    S.visitas.push({a:f.a,b:f.b,n:f.n,nombre:p.nombre,dni:p.dni,key:p.key});
  });
  if(S.sup&&!S.visitas.some(function(v){return v.key===S.sup;})) S.sup='';
  return issues;
}
function mesesConDatos(){
  var out=new Map();
  S.visitas.forEach(function(v){var d=new Date(v.a),k=d.getUTCFullYear()*12+d.getUTCMonth();out.set(k,(out.get(k)||0)+1);});
  return out;
}
function supervisores(){
  var map=new Map(); S.visitas.forEach(function(v){if(!map.has(v.key))map.set(v.key,v.nombre);});
  return Array.from(map.entries()).sort(function(a,b){return a[1].localeCompare(b[1],'es');});
}
function nombreSup(){var r=supervisores().filter(function(x){return x[0]===S.sup;})[0];return r?r[1]:'';}
function modelo(){
  var y=state.year, m=state.month, n=new Date(Date.UTC(y,m+1,0)).getUTCDate(), rows=[], tot=[0,0,0], delMes=0, filtradas=0;
  for(var d=1;d<=n;d++) rows.push({d:d,wd:(new Date(Date.UTC(y,m,d)).getUTCDay()+6)%7,f:[0,0,0],total:0});
  S.visitas.forEach(function(v){
    var dt=new Date(v.a); if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m) return;
    delMes++;
    if(S.sup&&v.key!==S.sup) return;
    filtradas++;
    var r=rows[dt.getUTCDate()-1], k=franjaDe(v.a); r.f[k]++; r.total++; tot[k]++;
  });
  return {y:y,m:m,n:n,rows:rows,tot:tot,total:tot[0]+tot[1]+tot[2],delMes:delMes,contadas:filtradas,cargadas:S.visitas.length};
}
function semanas(M){
  var weeks=[], cur=new Array(7).fill(null);
  M.rows.forEach(function(r){cur[r.wd]=r; if(r.wd===6){weeks.push(cur);cur=new Array(7).fill(null);}});
  if(cur.some(function(x){return x;})) weeks.push(cur);
  return weeks;
}

    var ws=wb.addWorksheet('Resumen');
    ws.mergeCells('A1:F1'); ws.getCell('A1').value=tit; ws.getCell('A1').font={bold:true,size:14};
    ['Día','Día de la semana','Total del día',FRANJAS[0],FRANJAS[1],FRANJAS[2]].forEach(function(t,i){var c=ws.getCell(3,i+1);c.value=t;c.font={bold:true};c.alignment=Object.assign({wrapText:true},centro);c.border=borde;c.fill=X.gris;});
    M.rows.forEach(function(r,i){
      [new Date(Date.UTC(M.y,M.m,r.d)),DIAS[r.wd],r.total,r.f[0],r.f[1],r.f[2]].forEach(function(v,j){var c=ws.getCell(4+i,j+1);c.value=v;c.alignment=centro;c.border=borde;if(j===0)c.numFmt='dd/mm/yyyy';if(j>=2)c.numFmt=NF;});
    });
    var tr=4+M.rows.length;
    ['Total del mes','',M.total,M.tot[0],M.tot[1],M.tot[2]].forEach(function(v,j){var c=ws.getCell(tr,j+1);c.value=v;c.font={bold:true};c.alignment=centro;c.border=borde;c.fill=X.gris;if(j>=2)c.numFmt='0';});
    ws.mergeCells(tr,1,tr,2);
    [14,18,14,20,20,20].forEach(function(w,i){ws.getColumn(i+1).width=w;});
    ws.views=[{state:'frozen',ySplit:3}];
  }
  if(inc.calendario){
    var wc=wb.addWorksheet('Calendario');
    wc.mergeCells('A1:G1'); wc.getCell('A1').value=tit; wc.getCell('A1').font={bold:true,size:14}; wc.getCell('A1').alignment=centro;
    for(var c0=1;c0<=7;c0++) wc.getColumn(c0).width=26;
    var r0=3;
    semanas(M).forEach(function(w){
      w.forEach(function(r,ci){
        if(!r) return;
        var h=wc.getCell(r0,ci+1); h.value=DIAS[r.wd]+' '+r.d; h.font={bold:true}; h.alignment=centro; h.border=borde; h.fill=X.gris;
        for(var k=0;k<3;k++){
          var c=wc.getCell(r0+1+k,ci+1), e=est(r.f[k]);
          c.value=FRANJAS[k]+'   '+r.f[k]; c.alignment=centro; c.border=borde; c.font={color:{argb:'FF1C2A35'}};
          c.fill={type:'pattern',pattern:'solid',fgColor:{argb:ARGB[e]}};
        }
      });
      r0+=4;
    });
    var lg=[['rojo','Rojo: sin visitas']]; if(S.thr>1) lg.push(['amarillo','Amarillo: '+(S.thr===2?'1 visita':'de 1 a '+(S.thr-1)+' visitas')]); lg.push(['verde','Verde: '+S.thr+(S.thr===1?' visita o más':' visitas o más')]);
    lg.forEach(function(x,i){var c=wc.getCell(r0+1,i+1);c.value=x[1];c.alignment=centro;c.border=borde;c.font={color:{argb:'FF1C2A35'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:ARGB[x[0]]}};});
    wc.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:1};
  }
}

/* ---- PDF ---- */
function pdf(ctx,inc){
  var M=modelo(), doc;
  if(inc.resumen){
    doc=ctx.nueva('portrait');
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(28,42,53); doc.text(titulo(M),14,18);
    pdfGrid(doc,26,[26,30,30,32,32,32],[['Día','Día de la semana','Total del día',FRANJAS[0],FRANJAS[1],FRANJAS[2]]],
      M.rows.map(function(r){return [fmtFecha(M.y,M.m,r.d),DIAS[r.wd],r.total?String(r.total):'-',r.f[0]?String(r.f[0]):'-',r.f[1]?String(r.f[1]):'-',r.f[2]?String(r.f[2]):'-'];}),
      ['Total del mes','',String(M.total),String(M.tot[0]),String(M.tot[1]),String(M.tot[2])],
      {x0:14,orient:'portrait',maxY:285,top:18});
  }
  if(inc.calendario){
    doc=ctx.nueva('landscape');
    var mx=10, cw=(297-2*mx)/7, y=23, hh=6, rh=5.6;
    doc.setTextColor(28,42,53); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text(titulo(M),mx,16);
    doc.setDrawColor(120,132,142); doc.setLineWidth(0.2);
    semanas(M).forEach(function(w){
      w.forEach(function(r,ci){
        if(!r) return;
        var x=mx+ci*cw;
        doc.setFillColor(223,230,235); doc.rect(x,y,cw,hh,'FD');
        doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(28,42,53);
        doc.text(DIAS[r.wd]+' '+r.d,x+cw/2,y+hh/2+1.3,{align:'center'});
        for(var k=0;k<3;k++){
          var e=est(r.f[k]), yy=y+hh+k*rh, col=RGB[e];
          doc.setFillColor(col[0],col[1],col[2]); doc.rect(x,yy,cw,rh,'FD');
          doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
          doc.text(FRANJAS[k],x+2,yy+rh/2+1.1);
          doc.setFont('helvetica','bold'); doc.text(String(r.f[k]),x+cw-2,yy+rh/2+1.1,{align:'right'});
        }
      });
      y+=hh+3*rh;
    });
    y+=6; doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var ley=[['rojo','Sin visitas']]; if(S.thr>1) ley.push(['amarillo',S.thr===2?'1 visita':'De 1 a '+(S.thr-1)+' visitas']); ley.push(['verde',S.thr+(S.thr===1?' visita o mas':' visitas o mas')]);
    ley.forEach(function(x,i){var col=RGB[x[0]], px=mx+i*55; doc.setFillColor(col[0],col[1],col[2]); doc.rect(px,y-3.2,4.5,4.5,'FD'); doc.text(x[1],px+7,y);});
  }
}

document.addEventListener('change',function(ev){
  var t=ev.target; if(!t.classList||!t.classList.contains('sel-sup')||state.varId!=='franjas') return;
  S.sup=t.value; renderTodo();
});

return {
  id:'franjas', nombre:NOMBRE, archivo:'visitas_por_franja',
  tabResumen:'Visitas por día y franja', tabCalendario:'Calendario',
  ayudaCarga:'Copiá las cuatro columnas de tu Excel (fecha de entrada, fecha de salida, supervisor y DNI) y pegalas acá. El formato de fecha esperado es dd/mm/aaaa hh:mm:ss. Los datos se procesan en tu navegador.',
  etiquetaPegado:'Fecha de entrada, fecha de salida, supervisor y DNI',
  placeholder:'23/09/2026 14:10:22\t23/09/2026 14:36:51\tAPELLIDO, NOMBRE\t12345678',
  botonResumen:'Ver visitas por franja',
  etiqueta:['visita válida','visitas válidas'], palabraOtros:'visitas',
  mensajeVacio:'No se encontraron visitas. Revisá que estés pegando fecha de entrada, fecha de salida, supervisor y DNI.',
  controlesHtml:'<label>Visitas para verde (cantidad mínima)<input id="umbral-vis" type="number" min="1" step="1" value="2"></label>',
  iniciarControles:iniciarControles, ayudaHtml:ayudaHtml,
  procesar:procesarFilas, n:function(){return S.visitas.length;}, hayDatos:function(){return S.visitas.length>0;},
  estadoTxt:function(){var n=S.visitas.length;return n===0?'sin visitas cargadas.':n+(n===1?' visita cargada.':' visitas cargadas.');},
  mesesConDatos:mesesConDatos, avisosCarga:avisosCarga, preview:preview,
  renderResumen:renderResumen, renderCalendario:renderCalendario,
  secciones:[{id:'resumen',label:'Resumen por día y franja (solapa 3)'},{id:'calendario',label:'Calendario con colores (solapa 4)'}],
  xlsx:xlsx, pdf:pdf, reiniciar:function(){S.sup='';},
  _modelo:modelo, _S:S
};
})();
VARS.franjas=FRA;

/* ---------- arranque ---------- */
Object.keys(VARS).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=VARS[k].nombre;$('variable').appendChild(o);});
$('variable').value=state.varId;
renderVariable();
renderTodo();
window.__app={state:state,VARS:VARS,procesar:procesar,renderTodo:renderTodo,goTab:goTab};
})();
</script>
